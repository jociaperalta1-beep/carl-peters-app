<style>
:root{--bg:#f1f5f9;--card:#fff;--side:#0f172a;--pri:#0f172a;--acc:#2563eb;--ok:#16a34a;--warn:#d97706;--err:#dc2626;--mut:#64748b;--bdr:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--pri);font-size:14px}.hidden{display:none!important}
.btn{border:none;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn-pri{background:var(--acc);color:#fff}.btn-ok{background:var(--ok);color:#fff}.btn-warn{background:var(--warn);color:#fff}
.btn-err{background:var(--err);color:#fff}.btn-dark{background:#1e293b;color:#fff}.btn-out{background:#fff;color:var(--pri);border:1px solid var(--bdr)}
.topbar{background:#090d16;color:#fff;padding:9px 14px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;z-index:60}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}.logo-img{height:28px;max-width:92px;object-fit:contain;background:#fff;border-radius:6px;padding:2px}
.b-on{background:rgba(22,163,74,.2);color:#4ade80;border:1px solid rgba(74,222,128,.4);padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.b-off{background:rgba(217,119,6,.2);color:#fbbf24;border:1px solid rgba(251,191,36,.4);padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.ws{display:grid;grid-template-columns:1fr;min-height:calc(100vh - 46px)}
.lock-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;background:#0f172a;min-height:calc(100vh - 46px)}
.lock-box{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:350px;display:grid;gap:10px}
.admin-wrap{display:flex;min-height:calc(100vh - 46px);width:100%}
.side{width:210px;background:var(--side);color:#cbd5e1;padding:10px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}

.nav{width:100%;text-align:left;background:transparent;color:#cbd5e1;border:none;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700}

.card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:12px;margin-bottom:10px}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--bdr)}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}
label{display:block;font-size:11px;font-weight:700;color:#334155;margin-bottom:3px}
input,select{width:100%;padding:7px 9px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:7px 8px;border-bottom:1px solid var(--bdr);text-align:left}th{background:#f8fafc}
.gps-bar{background:#0f172a;color:#fff;padding:8px 12px;border-radius:12px 12px 0 0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px}
.gps-bar select,.gps-bar input{background:#1e293b;color:#fff;border:1px solid #334155;width:auto;padding:5px 8px;font-size:12px}
#gpsMap{width:100%;height:calc(100vh - 130px);border-radius:0 0 12px 12px;border:1px solid var(--bdr);z-index:1}
.mob-col{background:#e2e8f0;padding:12px;display:flex;justify-content:center}.phone{width:100%;max-width:360px;background:#0f172a;border-radius:28px;padding:10px}
.screen{position:relative;background:#f8fafc;border-radius:20px;overflow:hidden;min-height:640px;display:flex;flex-direction:column}
.lock-ico{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(30,41,59,.9);color:#fff;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.mob-head{background:#0f172a;color:#fff;padding:11px 12px}.mob-head-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.live-tag{font-size:11px;font-weight:700;margin-top:2px}.live-tag.on{color:#4ade80}.live-tag.off{color:#f87171}
.mob-body{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
