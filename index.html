<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CARL PETERS — Asistencia & Nómina PY 2026</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root { --bg:#f1f5f9; --card:#fff; --side:#0f172a; --pri:#0f172a; --acc:#2563eb; --ok:#16a34a; --warn:#d97706; --err:#dc2626; --mut:#64748b; --bdr:#e2e8f0; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:system-ui,-apple-system,sans-serif; }
    body { background:var(--bg); color:var(--pri); font-size:14px; }
    .hidden { display:none !important; }
    .btn { border:none; border-radius:8px; padding:8px 12px; font-size:12px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
    .btn-pri { background:var(--acc); color:#fff; }
    .btn-ok { background:var(--ok); color:#fff; }
    .btn-warn { background:var(--warn); color:#fff; }
    .btn-err { background:var(--err); color:#fff; }
    .btn-dark { background:#1e293b; color:#fff; }
    .btn-out { background:#fff; color:var(--pri); border:1px solid var(--bdr); }
    .topbar { background:#090d16; color:#fff; padding:10px 16px; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; position:sticky; top:0; z-index:60; }
    .brand { display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; }
    .logo-img { height:28px; max-width:96px; object-fit:contain; background:#fff; border-radius:6px; padding:2px; }
    .badge-on { background:rgba(22,163,74,.2); color:#4ade80; border:1px solid rgba(74,222,128,.4); padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; }
    .badge-off { background:rgba(217,119,6,.2); color:#fbbf24; border:1px solid rgba(251,191,36,.4); padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; }
    .ws { display:grid; grid-template-columns:1fr 380px; min-height:calc(100vh - 48px); }
    @media (max-width:1100px) { .ws { grid-template-columns:1fr; } }
    .lock-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; background:#0f172a; min-height:calc(100vh - 48px); }
    .lock-box { background:#fff; border-radius:14px; padding:22px; width:100%; max-width:360px; display:grid; gap:10px; }
    .admin-wrap { display:flex; min-height:100%; }
    .side { width:215px; background:var(--side); color:#cbd5e1; padding:12px 10px; display:flex; flex-direction:column; gap:5px; flex-shrink:0; }
    @media (max-width:780px) { .admin-wrap { flex-direction:column; } .side { width:100%; flex-direction:row; flex-wrap:wrap; } }
    .nav { width:100%; text-align:left; background:transparent; color:#cbd5e1; border:none; padding:9px 11px; border-radius:8px; cursor:pointer; font-size:12px; font-weight:700; }
    @media (max-width:780px) { .nav { width:auto; } }
    .nav.active, .nav:hover { background:var(--acc); color:#fff; }
    .main { flex:1; padding:16px; overflow-x:auto; }
    .card { background:var(--card); border:1px solid var(--bdr); border-radius:12px; padding:14px; margin-bottom:12px; }
    .card-top { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--bdr); }
    .grid-3 { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; }
    .grid-4 { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
    label { display:block; font-size:11px; font-weight:700; color:#334155; margin-bottom:4px; }
    input, select { width:100%; padding:8px 10px; border:1px solid #cbd5e1; border-radius:8px; font-size:13px; background:#fff; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th, td { padding:8px; border-bottom:1px solid var(--bdr); text-align:left; }
    th { background:#f8fafc; }
    .gps-bar { background:#0f172a; color:#fff; padding:8px 12px; border-radius:12px 12px 0 0; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:6px; }
    .gps-bar select, .gps-bar input { background:#1e293b; color:#fff; border:1px solid #334155; width:auto; padding:5px 8px; font-size:12px; }
    #gpsMap { width:100%; height:calc(100vh - 130px); border-radius:0 0 12px 12px; border:1px solid var(--bdr); z-index:1; }
    /* MOBILE APK */
    .mob-col { background:#e2e8f0; padding:14px; display:flex; justify-content:center; border-left:1px solid #cbd5e1; }
    .phone { width:100%; max-width:356px; background:#0f172a; border-radius:30px; padding:10px; }
    .screen { position:relative; background:#f8fafc; border-radius:22px; overflow:hidden; min-height:650px; display:flex; flex-direction:column; }
    .lock-ico { position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%; border:1px solid rgba(255,255,255,.2); background:rgba(15,23,42,.65); color:#fff; font-size:14px; cursor:pointer; z-index:25; }
    .mob-head { background:#0f172a; color:#fff; padding:12px 48px 12px 12px; }
    .mob-body { padding:10px; display:flex; flex-direction:column; gap:8px; flex:1; }
    .mob-auth { padding:14px; display:flex; flex-direction:column; gap:10px; flex:1; background:linear-gradient(180deg,#0f172a 0%,#1e293b 32%,#f8fafc 32.2%); }
    .tabs-2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; background:#e2e8f0; padding:3px; border-radius:8px; }
    .tab-btn { border:none; background:transparent; padding:7px; border-radius:6px; font-size:12px; font-weight:700; cursor:pointer; }
    .tab-btn.active { background:var(--acc); color:#fff; }
    .fp-zone { margin-top:auto; background:#fff; border:1px solid var(--bdr); border-radius:14px; padding:12px; text-align:center; }
    .fp-btn { width:82px; height:82px; border-radius:50%; border:3px solid var(--acc); background:#0f172a; color:#38bdf8; font-size:30px; margin:8px auto; display:flex; align-items:center; justify-content:center; cursor:pointer; touch-action:manipulation; }
    .fp-btn.scan { border-color:var(--ok); color:#4ade80; transform:scale(.95); }
    @media (max-width:900px) { .topbar, #adminLock, #adminPanel { display:none !important; } .ws { grid-template-columns:1fr !important; min-height:100vh !important; } }
    body.mob-only .topbar, body.mob-only #adminLock, body.mob-only #adminPanel { display:none !important; }
    body.mob-only .ws { grid-template-columns:1fr !important; min-height:100vh !important; }
    body.mob-only .mob-col { padding:0 !important; background:#f8fafc !important; border:none !important; min-height:100vh !important; }
    body.mob-only .phone { max-width:100% !important; border-radius:0 !important; padding:0 !important; flex:1; display:flex; }
    body.mob-only .screen { border-radius:0 !important; min-height:100vh !important; flex:1; }
    @media print { .topbar, .side, .mob-col, .no-print { display:none !important; } .ws { display:block; } }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <img id="topLogo" class="logo-img hidden" alt="Logo" />
      <span>CARL PETERS</span>
      <span id="fbBadge" class="badge-off">Conectando a Firestore...</span>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <button class="btn btn-out" onclick="setLayout('both')">Split Web + APK</button>
      <button class="btn btn-out" onclick="setLayout('admin')">Solo Admin</button>
      <button class="btn btn-out" onclick="setLayout('mobile')">Solo APK</button>
    </div>
  </div>

  <div id="ws" class="ws">
    <section id="adminLock" class="lock-wrap">
      <form class="lock-box" onsubmit="loginAdmin(event)">
        <h3 style="font-weight:800;">CARL PETERS — Admin</h3>
        <div><label>Usuario</label><input id="admUser" value="admin" required /></div>
        <div><label>Clave / PIN</label><input id="admPass" type="password" placeholder="2026 o 5722677" required /></div>
        <button class="btn btn-pri" type="submit" style="justify-content:center;padding:10px;">Entrar</button>
      </form>
    </section>

        <button class="nav" data-tab="cal" onclick="openTab('cal')">📅 Calendario & PDF</button>
        <button class="nav" data-tab="gps" onclick="openTab('gps')">🛰️ Ubicación GPS</button>
        <button class="nav" data-tab="cfg" onclick="openTab('cfg')">⚙️ Configuración</button>
        <button class="nav" style="margin-top:auto;color:#fca5a5;" onclick="logoutAdmin()">🔒 Salir</button>
      </aside>

              <tbody id="hoyBody"></tbody>
            </table>
          </div>
        </div>

              <div><label>C.I.</label><input id="newEmpCi" placeholder="4.123.456" /></div>
              <div><label>Sector</label><input id="newEmpSec" value="Ganado" /></div>
              <div><label>PIN (4 dígitos)</label><input id="newEmpPin" maxlength="4" value="1234" /></div>
            </div>
            <div style="margin-top:8px;display:flex;justify-content:flex-end;"><button class="btn btn-pri" onclick="saveNewEmployee()">+ Guardar</button></div>
          </div>
          <div class="card">
            <div class="card-top"><strong>Empleados Registrados</strong></div>
            <table>
              <thead><tr><th>Nombre</th><th>C.I.</th><th>Sector</th><th>PIN</th><th>Acciones</th></tr></thead>
              <tbody id="empBody"></tbody>
            </table>

              <div class="grid-4">
